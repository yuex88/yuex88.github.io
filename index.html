、盼涨赚钱；做空 = 先卖后买、盼跌赚钱。现货只能做多，合约两个方向都能做。"]]},{"cat":"基础概念","title":"K 线基础","items":[["一根 K 线","代表一段时间内的四个价格：开盘价、最高价、最低价、收盘价（简称 OHLC）。"],["阳线 / 阴线","收盘价高于开盘价是阳线（涨），低于开盘价是阴线（跌）。站内默认涨绿跌红，可在「我的」里翻转。"],["实体与影线","中间的粗柱是开盘到收盘的区间；上下细线是影线。上影线长，说明冲高后被卖了下来；下影线长，说明跌下去又被买了回来。"],["周期","1 分钟、15 分钟、1 小时、日线……一根 K 线覆盖的时间。周期越大越看大势，越小噪声越多；新手别盯着 1 分钟线频繁操作。"],["成交量","这段时间买卖了多少。价格上涨同时放量，走势相对扎实；价格涨、量跟不上，或者放量下跌，都要多留个心眼。"]]},{"cat":"基础概念","title":"下单：限价与市价","items":[["市价单","按当前市场最优价立刻成交，图快。行情剧烈时实际成交价可能和你看到的不一样，这叫滑点。"],["限价单","自己定价，价格到了才成交，不到就不成交。挂着没成交前随时可以撤销，资金会先冻结。"],["挂单 / 吃单","把单子挂在盘口等成交叫挂单（maker），手续费通常更低；直接和盘口现有单子成交叫吃单（taker），通常更高。"],["盘口","买单和卖单排队的地方：上面是卖盘（别人愿意卖的价），下面是买盘。买卖价差越小，流动性越好。"]]},{"cat":"量价口诀","title":"量价口诀","items":[["快涨慢跌","是出货"],["快跌慢涨","是吸筹"],["放量上涨","必然回落"],["缩量不跌","头部已成"],["缩量上涨","继续上涨"],["缩量下跌","继续下跌"],["缩量不涨","头部已现"],["放量下跌","必然反弹"],["缩量不跌（低位）","筑底成——同样缩量不跌，出现在低位是卖盘枯竭、在磨底，和高位的头部已成正好相反，看位置定性"],["放量不涨","头部现——量放出来了价却推不动，买盘接不住卖压"],["量大成头，量小成底","天量往往对应顶部，地量往往对应底部"],["量价同步涨","趋势稳——价涨量增、步调一致，上涨相对扎实"],["量价同步跌","跌势难停——价跌量增，卖压还在释放，别急着接飞刀"],["价涨量缩背离","冲高撤退——价格创了新高、量却跟不上，上涨动能在衰减"],["价跌量缩背离","见底有机会——跌势里量缩到极致，抛压接近枯竭"],["放量突破关键位","趋势转强——放量站上关键价位，突破的可信度高"],["缩量跌破支撑位","跌势长——跌破支撑还没人接，可能阴跌很久"],["盘整缩量待方向","放量突破再进场——横盘缩量时先观望，等放量选出方向再跟"],["急涨放量易回调","急跌放量可抄底——短线情绪冲到极端容易反着走，但抄底也要等止跌信号"],["高位放巨量","看空——高位突然放出巨量，多是资金在派发离场"],["低位放巨量下跌","必有反弹——低位恐慌盘集中涌出之后，往往迎来修复"],["放量滞涨","顶部信号——量放大了、价格却横住不动，上攻乏力"]]},{"cat":"K线口诀","title":"K线口诀","items":[["买横买坑不买竖，卖点就在鼎沸处","横盘和回调的坑里买，别追竖直拉升；最热闹的时候反而是卖点"],["连续小涨是真涨，连续大涨要离场","小步慢涨走得稳，连续大阳透支涨幅，要考虑离场"],["大幅冲高要回踩，不挖深坑不大买","冲高之后多有回踩确认；没有像样的回调坑，不急着大买"],["主升加速要见顶","急跌急卖缓涨缓卖——主升浪末端加速往往接近顶部，卖出节奏跟着涨跌速度走"],["急跌无量是恐吓，缓跌放量赶紧撤","无量急跌多是洗盘吓人；慢慢阴跌还放量，是真有资金在撤"],["价格突破生命线，不要犹豫做波段","站上关键均线（生命线）是波段转强的信号"],["上攻没量别站岗，增量回升要进场","上攻无量难持续、别恋战守仓；等成交量重新放大、价格回升再进"],["缩量新低是底像，增量回升要进场","缩量创新低说明抛压枯竭、像底；确认进场仍等量能回升"],["不冲高不卖，不跳水不买，横盘整理不交易","等信号明确再动手，横盘没方向时空仓也是操作"],["买阴不买阳，卖阳不卖阴","回调阴线时低吸，拉升阳线时兑现，逆着情绪做"],["高低盘整，再等一等","高位或低位横盘时方向未明，等它自己选方向"],["高位横盘再冲高，抓住时机赶紧抛","高位横盘后再冲一波，多是最后的出货机会"],["低位横盘又新低，全仓买进好时机","低位横盘磨底后假摔出新低，往往是见底信号；实际下手分批进场更稳"],["未曾下手先认错，宁可买少勿买多","下单前先想好错了怎么办、在哪止损；仓位宁小勿满"]]},{"cat":"合约与风险","title":"杠杆与强平","items":[["杠杆","用小钱撬动大仓位。10 倍杠杆就是 100 元当 1,000 元用，盈亏按 1,000 元的仓位算，放大 10 倍——赚得快，亏得同样快。"],["保证金","你押在这个仓位上的本金。亏损先从保证金里扣，扣到警戒线就危险了。"],["强平（爆仓）","亏损快要吃完保证金时，交易所强制按市价平仓，仓位没了，保证金也基本亏光，不等你同意。"],["简化示例","10 倍杠杆做多，价格反向跌约 10%，保证金就差不多亏完；实际强平会更早触发（还要留维持保证金、扣手续费），杠杆越高，容错越小。"],["逐仓 / 全仓","逐仓：每个仓位的保证金独立，爆仓只亏那一份。全仓：整个合约账户的钱一起给仓位垫底，扛得久一点，但极端行情可能一起亏光。"]]},{"cat":"合约与风险","title":"资金费率","items":[["是什么","永续合约里多空双方互相支付的费用，用来让合约价格别离现货价格太远；钱在多空之间流动，不是交给交易所的手续费。"],["谁付谁","费率为正：做多的人付给做空的人；费率为负：做空的人付给做多的人。你持仓跨过结算时刻才涉及支付。"],["结算节奏","按各交易所规则定时结算，常见为每 8 小时一次，具体以交易所公告为准。"],["怎么用","费率绝对值很高，说明一边的人挤得太多（比如全在追多），是行情过热的参考信号之一，但不能单独当作买卖依据。"]]},{"cat":"合约与风险","title":"止盈与止损","items":[["止损","预先设一个价，跌到就自动卖出或平仓，把单笔亏损封顶在自己能承受的范围。开仓之前先想好止损位，而不是亏了再想。"],["止盈","涨到预设价自动落袋为安，避免利润坐过山车又跌回去。可以分批止盈：先卖一部分保住本金，剩下的继续跟。"],["仓位管理","先定「这笔最多亏多少」再定买多少。老手的经验法则是单笔风险只占本金的一小部分——这是经验，不是保证，关键是亏一笔不伤元气。"],["注意事项","行情跳空或瞬间剧烈波动时，止盈止损的实际成交价可能比预设价差不少。止损是刹车，不是保险箱。"]]},{"cat":"打新常识","title":"链上打新常识","items":[["打新","项目刚在链上开放时参与认购或 mint，图的是以较低成本拿到新币或新 NFT；能不能涨没人保证，很多新币开盘即巅峰。"],["先核三件事","官网和官方账号对不对得上；合约地址是不是官方公布的那一个；是不是真免费——有些号称免费，却在别的环节另收费。"],["授权（approve）","参与时常要授权某个合约动用你的币。额度别给无限大，打完及时撤销不用的授权，恶意合约拿到大额授权能直接转走你的币。"],["Gas 费","链上每笔操作都要付网络费：BSC 链用 BNB 付，以太坊用 ETH 付。钱包里没有 Gas，交易发不出去。"],["防钓鱼","假官网、假客服私信、「先验证钱包」都是常见套路。凡是让你输入助记词或私钥的页面和人，百分之百是骗子。"]]}];var MRISKS=["量价与 K 线口诀是经验总结，不是万能公式：同一个形态出现在不同位置、不同趋势里，含义可能完全相反，要结合所处位置与大盘趋势一起判断，并始终控制仓位、设好止损。","加密货币波动极大，一天涨跌百分之几十并不稀奇。只用亏得起的钱，别借钱、别押上生活费。","杠杆放大盈亏，新手先从现货和小仓位练起，看懂规则再碰合约。","赚赔都是数字游戏；真金白银进场之前，先把这一页的规则弄懂。","助记词和私钥只属于你自己：不截图、不发给任何人、不输进任何网站。","凡是承诺保本、高收益、稳赚不赔的，基本都是骗局，离得越远越好。"];function ManualPage(){let e=Je();return c("div",{style:{paddingTop:__96},children:[c("div",{style:{display:"flex",alignItems:__4,gap:10},children:[a(__1,{type:__1,"aria-label":"返回",onClick:()=>e.showPage("profile"),style:{background:__7,backdropFilter:__11,WebkitBackdropFilter:__11,border:0,borderRadius:"50%",width:31,heig         root.style.removeProperty(name);
        probe.style.height = "var(" + name + ")";
        var measured = probe.getBoundingClientRect().height;
        if (!isFinite(measured) || measured < 0) continue;
        root.style.setProperty(name, (Math.round(measured * dpr) / dpr) + "px");
      }
      fitted = true;
    }
    function schedule() {
      if (raf) return;
      raf = requestAnimationFrame(function () { raf = 0; fit(); });
    }
    fit();
    window.addEventListener("resize", schedule);
    window.addEventListener("orientationchange", schedule);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", schedule);
  }
  if (document.body) install();
  else document.addEventListener("DOMContentLoaded", install);
})();
</script>
